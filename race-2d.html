<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Race</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3e8e41;font-family:system-ui,Segoe UI,sans-serif}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ====== Basis ======
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){ DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px'; }
addEventListener('resize', resize); resize();

const LAPS = 3;          // aantal rondes
const ROAD = 160;        // breedte van de weg
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wrap = a => { while(a > Math.PI) a -= 2*Math.PI; while(a < -Math.PI) a += 2*Math.PI; return a; };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ====== Circuit ======
const CTRL = [[400,1600],[400,600],[700,300],[1200,350],[1400,700],[1800,800],[2200,450],
              [2700,600],[2800,1100],[2400,1400],[1900,1300],[1500,1650],[900,1800]];
const cr = (a,b,c,d,t,t2,t3) => 0.5*((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
let PTS = [];
for (let i = 0; i < CTRL.length; i++){
  const L = CTRL.length, p0 = CTRL[(i-1+L)%L], p1 = CTRL[i], p2 = CTRL[(i+1)%L], p3 = CTRL[(i+2)%L];
  const n = Math.max(8, Math.round(Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) / 25));
  for (let s = 0; s < n; s++){ const t = s/n, t2 = t*t, t3 = t2*t;
    PTS.push({ x: cr(p0[0],p1[0],p2[0],p3[0],t,t2,t3), y: cr(p0[1],p1[1],p2[1],p3[1],t,t2,t3) }); }
}
PTS = PTS.slice(12).concat(PTS.slice(0,12)); // startlijn op het rechte stuk
const N = PTS.length;
function dir(i){ const a = PTS[(i+N)%N], b = PTS[(i+1+N)%N], dx = b.x-a.x, dy = b.y-a.y, l = Math.hypot(dx,dy) || 1; return {x:dx/l, y:dy/l}; }

const roadPath = new Path2D();
roadPath.moveTo(PTS[0].x, PTS[0].y); for (const p of PTS) roadPath.lineTo(p.x, p.y); roadPath.closePath();

let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
for (const p of PTS){ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }
const B = { x0:minX-450, y0:minY-450, x1:maxX+450, y1:maxY+450 };

// Decoratie: bomen en grasvlekken (vaste "random" zodat het circuit altijd hetzelfde is)
const R = rng(42), trees = [], patches = [];
function nearRoad(x,y,m){ for (let i = 0; i < N; i += 2){ if (Math.hypot(PTS[i].x-x, PTS[i].y-y) < m) return true; } return false; }
while (trees.length < 140){ const x = B.x0 + R()*(B.x1-B.x0), y = B.y0 + R()*(B.y1-B.y0);
  if (!nearRoad(x,y,ROAD/2+70)) trees.push({x, y, r: 22+R()*20}); }
for (let i = 0; i < 90; i++) patches.push({x:B.x0+R()*(B.x1-B.x0), y:B.y0+R()*(B.y1-B.y0), r:40+R()*120});

// ====== Auto's ======
let cars, player, state = 'menu', cd = 0, raceTime = 0, skids = [], msg = null, finishOrder = [];
const cam = {x: PTS[0].x, y: PTS[0].y, z: 1};
let bestEver = null; try { bestEver = parseFloat(localStorage.getItem('turborace_best')) || null; } catch(e){}

function makeCar(name, color, ai, skill, gridIdx, side){
  const d = dir(gridIdx), p = PTS[gridIdx];
  return { name, color, ai, skill, x: p.x - d.y*side, y: p.y + d.x*side, h: Math.atan2(d.y,d.x),
    vx:0, vy:0, vf:0, vr:0, steerSm:0, idx:gridIdx, total:gridIdx-N, maxFloor:-1, dist:0,
    lapStart:0, lastLap:null, best:null, finished:false, finishTime:0, phase: Math.random()*6, prevW:null };
}
function reset(){
  cars = [
    makeCar('Blitz',  '#f9a825', true, 0.93, N-2, -38),
    makeCar('Vortex', '#8e24aa', true, 0.89, N-2,  38),
    makeCar('Jij',    '#e53935', false, 1,   N-5, -38),
    makeCar('Rocket', '#1e88e5', true, 0.85, N-5,  38),
  ];
  player = cars[2]; skids = []; finishOrder = []; raceTime = 0; msg = null;
  cam.x = player.x; cam.y = player.y;
}
reset();
function startRace(){ reset(); state = 'countdown'; cd = 3.5; }

// ====== Besturing ======
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' && (state === 'menu' || state === 'done')) startRace();
  if (e.code === 'KeyR' && state !== 'menu') startRace();
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', () => { if (state === 'menu' || state === 'done') startRace(); });

function playerInput(){
  return { up: keys.ArrowUp || keys.KeyW, down: keys.ArrowDown || keys.KeyS, brake: keys.Space,
    steer: ((keys.ArrowRight || keys.KeyD) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA) ? 1 : 0) };
}
function aiInput(c, t){
  const look = 10 + Math.floor(Math.abs(c.vf)/45), i = (c.idx+look)%N, p = PTS[i], d = dir(i);
  const off = Math.sin(t*0.3 + c.phase) * 35;
  const tx = p.x - d.y*off, ty = p.y + d.x*off;
  const a = wrap(Math.atan2(ty-c.y, tx-c.x) - c.h);
  const d2 = dir(i+15), curve = Math.abs(wrap(Math.atan2(d2.y,d2.x) - Math.atan2(d.y,d.x)));
  const target = 640*c.skill*(1 - Math.min(0.5, curve*0.9));
  return { steer: clamp(a*2.2,-1,1), up: c.vf < target, down: c.vf > target+60, brake:false };
}

// ====== Natuurkunde ======
function physics(c, inp, dt){
  const fx = Math.cos(c.h), fy = Math.sin(c.h), rx = -fy, ry = fx;
  let vf = c.vx*fx + c.vy*fy, vr = c.vx*rx + c.vy*ry;
  const off = c.dist > ROAD/2;
  const maxV = (off ? 260 : 640) * c.skill;
  if (inp.up && vf < maxV) vf += 520*dt;
  if (inp.down){ if (vf > 20) vf -= 1100*dt; else if (vf > -180) vf -= 350*dt; }
  vf -= vf*(off ? 2.2 : 0.35)*dt;                 // luchtweerstand / gras
  if (vf > maxV) vf += (maxV-vf)*3*dt;
  vr *= Math.exp(-(inp.brake ? 1.6 : off ? 4 : 9)*dt); // grip (handrem = driften!)
  if (inp.brake) vf -= vf*0.6*dt;
  const sp = Math.min(1, Math.abs(vf)/180) * Math.sign(vf);
  const turn = 2.7 - Math.min(1, Math.abs(vf)/640)*0.9;
  c.steerSm += (inp.steer - c.steerSm)*Math.min(1, dt*10);
  c.h += c.steerSm*turn*sp*dt*(inp.brake ? 1.35 : 1);
  c.vx = fx*vf + rx*vr; c.vy = fy*vf + ry*vr;
  c.x += c.vx*dt; c.y += c.vy*dt;
  if (c.x < B.x0){ c.x = B.x0; c.vx = 0; } if (c.x > B.x1){ c.x = B.x1; c.vx = 0; }
  if (c.y < B.y0){ c.y = B.y0; c.vy = 0; } if (c.y > B.y1){ c.y = B.y1; c.vy = 0; }
  c.vf = vf; c.vr = vr;

  // remsporen
  if (Math.abs(vr) > 110 || (inp.brake && Math.abs(vf) > 120)){
    const w = [[c.x-fx*14+rx*9, c.y-fy*14+ry*9], [c.x-fx*14-rx*9, c.y-fy*14-ry*9]];
    if (c.prevW) for (let k = 0; k < 2; k++) skids.push([c.prevW[k][0], c.prevW[k][1], w[k][0], w[k][1]]);
    c.prevW = w; if (skids.length > 2500) skids.splice(0, skids.length-2500);
  } else c.prevW = null;
}

function trackProgress(c){
  let best = c.idx, bd = 1e18;
  for (let k = -15; k <= 15; k++){ const i = (c.idx+k+N)%N, dx = PTS[i].x-c.x, dy = PTS[i].y-c.y, d = dx*dx+dy*dy;
    if (d < bd){ bd = d; best = i; } }
  if (bd > 500*500){ for (let i = 0; i < N; i++){ const dx = PTS[i].x-c.x, dy = PTS[i].y-c.y, d = dx*dx+dy*dy; if (d < bd){ bd = d; best = i; } } }
  let delta = best - c.idx; if (delta > N/2) delta -= N; if (delta < -N/2) delta += N;
  if (Math.abs(delta) <= 40) c.total += delta;   // afsnijden telt niet mee
  c.idx = best; c.dist = Math.sqrt(bd);

  const fl = Math.floor(c.total/N);
  if (fl > c.maxFloor){
    c.maxFloor = fl;
    if (fl >= 1 && !c.finished){
      const lt = raceTime - c.lapStart; c.lastLap = lt; if (!c.best || lt < c.best) c.best = lt; c.lapStart = raceTime;
      if (!c.ai){
        let txt = 'Ronde ' + fl + ': ' + fmt(lt);
        if (!bestEver || lt < bestEver){ bestEver = lt; txt += '  — NIEUW RECORD!'; try { localStorage.setItem('turborace_best', lt); } catch(e){} }
        msg = { text: txt, t: 2.5 };
      }
      if (fl >= LAPS){ c.finished = true; c.finishTime = raceTime; finishOrder.push(c); if (!c.ai) state = 'done'; }
    }
  }
}

function collisions(){
  for (let i = 0; i < cars.length; i++) for (let j = i+1; j < cars.length; j++){
    const a = cars[i], b = cars[j], dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy);
    if (d > 0 && d < 34){
      const nx = dx/d, ny = dy/d, o = (34-d)/2;
      a.x -= nx*o; a.y -= ny*o; b.x += nx*o; b.y += ny*o;
      const rv = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if (rv < 0){ const imp = -1.3*rv/2; a.vx -= imp*nx; a.vy -= imp*ny; b.vx += imp*nx; b.vy += imp*ny; }
    }
  }
}

function ranking(){
  return [...cars].sort((a,b) => (a.finished && b.finished) ? a.finishTime-b.finishTime
    : a.finished ? -1 : b.finished ? 1 : b.total - a.total);
}

// ====== Update ======
let simT = 0;
function update(dt){
  simT += dt;
  if (msg){ msg.t -= dt; if (msg.t <= 0) msg = null; }
  if (state === 'countdown'){ cd -= dt; if (cd <= 0.5){ state = 'race'; } }
  if (state === 'race' || state === 'done'){
    raceTime += dt;
    for (const c of cars){
      const inp = c.ai ? aiInput(c, simT) : (state === 'done' ? {up:false, down:false, brake:false, steer:0} : playerInput());
      physics(c, inp, dt); trackProgress(c);
    }
    collisions();
  }
  const z = clamp(Math.min(W,H)/850, 0.5, 1.4) * (1 - Math.min(1, Math.abs(player.vf)/640)*0.18);
  cam.z += (z-cam.z)*Math.min(1, dt*3);
  cam.x += (player.x + player.vx*0.25 - cam.x)*Math.min(1, dt*5);
  cam.y += (player.y + player.vy*0.25 - cam.y)*Math.min(1, dt*5);
}

// ====== Tekenen ======
function fmt(t){ if (t == null) return '–:––.––'; const m = Math.floor(t/60), s = t - m*60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); }

function drawCar(c){
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.h);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.roundRect(-20,-9,46,24,6); ctx.fill();
  ctx.fillStyle = '#111';
  for (const [x,y] of [[-17,-14],[8,-14],[-17,10],[8,10]]) ctx.fillRect(x,y,11,4);
  ctx.fillStyle = c.color; ctx.beginPath(); ctx.roundRect(-22,-11,44,22,6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(-22,-2,44,4);
  ctx.fillStyle = '#1b2733'; ctx.beginPath(); ctx.roundRect(2,-8,9,16,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-15,-7,5,14,2); ctx.fill();
  ctx.fillStyle = '#fff59d'; ctx.fillRect(19,-9,3,5); ctx.fillRect(19,4,3,5);
  ctx.restore();
  if (!c.ai){ // pijltje boven de speler
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(c.x-8, c.y-40); ctx.lineTo(c.x+8, c.y-40); ctx.lineTo(c.x, c.y-30); ctx.fill();
  }
}

function drawWorld(){
  const z = cam.z;
  ctx.setTransform(DPR*z, 0, 0, DPR*z, DPR*(W/2 - cam.x*z), DPR*(H/2 - cam.y*z));
  ctx.fillStyle = '#2e6b30'; ctx.fillRect(B.x0-3000, B.y0-3000, B.x1-B.x0+6000, B.y1-B.y0+6000);
  ctx.fillStyle = '#4c9a4f'; ctx.fillRect(B.x0, B.y0, B.x1-B.x0, B.y1-B.y0);
  ctx.fillStyle = 'rgba(0,60,0,.12)';
  for (const p of patches){ ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 10; ctx.strokeRect(B.x0, B.y0, B.x1-B.x0, B.y1-B.y0);

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = ROAD+22; ctx.stroke(roadPath);
  ctx.setLineDash([28,28]); ctx.strokeStyle = '#fff'; ctx.stroke(roadPath); ctx.setLineDash([]);
  ctx.strokeStyle = '#555a60'; ctx.lineWidth = ROAD; ctx.stroke(roadPath);
  ctx.setLineDash([40,40]); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 4; ctx.stroke(roadPath); ctx.setLineDash([]);

  // start/finish
  const p = PTS[0], d = dir(0);
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(d.y, d.x));
  for (let r = 0; r < 2; r++) for (let k = 0; k < ROAD/16; k++){ ctx.fillStyle = (r+k)%2 ? '#fff' : '#111'; ctx.fillRect(-16+r*16, -ROAD/2+k*16, 16, 16); }
  ctx.restore();

  ctx.strokeStyle = 'rgba(25,25,25,.35)'; ctx.lineWidth = 4; ctx.beginPath();
  for (const s of skids){ ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); } ctx.stroke();

  for (const c of cars) drawCar(c);

  for (const t of trees){ ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(t.x+8, t.y+8, t.r, 0, 7); ctx.fill(); }
  for (const t of trees){ ctx.fillStyle = '#1b5e20'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(t.x-t.r*.25, t.y-t.r*.25, t.r*.6, 0, 7); ctx.fill(); }
}

function panel(x, y, w, h){ ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); }
function text(s, x, y, size, color='#fff', align='left', weight='600'){
  ctx.font = weight + ' ' + size + 'px system-ui,Segoe UI,sans-serif'; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); }

function drawHUD(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rank = ranking(), pos = rank.indexOf(player) + 1;
  const lap = clamp(player.maxFloor+1, 1, LAPS);

  if (state !== 'menu'){
    panel(16, 16, 220, 136);
    text('POSITIE', 30, 40, 12, '#bbb'); text(pos + '/' + cars.length, 30, 74, 32, '#fff', 'left', '800');
    text('RONDE', 140, 40, 12, '#bbb'); text(lap + '/' + LAPS, 140, 74, 32, '#fff', 'left', '800');
    text('Tijd   ' + fmt(raceTime), 30, 102, 14);
    text('Beste  ' + fmt(player.best) + (bestEver ? '   (rec ' + fmt(bestEver) + ')' : ''), 30, 124, 13, '#ffd54f');
    if (player.lastLap != null) text('Vorige ' + fmt(player.lastLap), 30, 142, 12, '#ccc');

    panel(W-150, H-86, 134, 70);
    text(Math.round(Math.abs(player.vf)*0.35), W-30, H-40, 38, '#fff', 'right', '800');
    text('km/u', W-30, H-24, 12, '#bbb', 'right');
  }

  // minimap
  const mw = Math.min(220, W*0.3), s = mw/(maxX-minX+200), mh = (maxY-minY+200)*s, mx = W-mw-16, my = 16;
  panel(mx-8, my-8, mw+16, mh+16);
  ctx.save(); ctx.translate(mx + (100-minX)*s, my + (100-minY)*s); ctx.scale(s, s);
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 50; ctx.lineJoin = 'round'; ctx.stroke(roadPath);
  for (const c of cars){ ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(c.x, c.y, c.ai ? 45 : 65, 0, 7); ctx.fill();
    if (!c.ai){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 18; ctx.stroke(); } }
  ctx.restore();

  if (msg){ ctx.globalAlpha = Math.min(1, msg.t*2); panel(W/2-210, 90, 420, 50); text(msg.text, W/2, 123, 20, '#fff', 'center', '700'); ctx.globalAlpha = 1; }

  if (state === 'countdown' || (state === 'race' && raceTime < 0.8)){
    const n = Math.ceil(cd - 0.5), label = state === 'race' ? 'START!' : n > 0 ? String(n) : 'START!';
    text(label, W/2, H/2 - 60, 110, label === 'START!' ? '#69f0ae' : '#ffeb3b', 'center', '900');
  }

  if (state === 'menu'){
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text('TURBO RACE', W/2, H/2-90, Math.min(90, W/8), '#ffeb3b', 'center', '900');
    text('↑ / W  gas     ↓ / S  rem & achteruit     ← → / A D  sturen', W/2, H/2-20, 18, '#fff', 'center', '500');
    text('SPATIE  handrem (driften!)      R  opnieuw starten', W/2, H/2+10, 18, '#fff', 'center', '500');
    text(LAPS + ' rondes tegen 3 tegenstanders', W/2, H/2+50, 16, '#ccc', 'center', '500');
    if (Math.floor(simT*2) % 2 === 0) text('Druk op ENTER of klik om te starten', W/2, H/2+110, 24, '#69f0ae', 'center', '800');
  }

  if (state === 'done'){
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    const place = finishOrder.indexOf(player) + 1;
    text(place === 1 ? '🏆 JE HEBT GEWONNEN!' : 'FINISH! Je werd ' + place + 'e', W/2, H/2-130, 44, '#ffeb3b', 'center', '900');
    panel(W/2-200, H/2-100, 400, 40 + cars.length*36);
    ranking().forEach((c, i) => {
      const y = H/2-62 + i*36;
      ctx.fillStyle = c.color; ctx.fillRect(W/2-180, y-14, 16, 16);
      text((i+1) + '.  ' + c.name, W/2-150, y, 20, c.ai ? '#fff' : '#ffeb3b', 'left', c.ai ? '600' : '800');
      text(c.finished ? fmt(c.finishTime) : 'nog onderweg…', W/2+180, y, 18, '#ddd', 'right');
    });
    text('Beste ronde: ' + fmt(player.best), W/2, H/2+100 + cars.length*10, 18, '#ffd54f', 'center');
    text('Druk op ENTER of klik voor nog een race', W/2, H/2+140 + cars.length*10, 20, '#69f0ae', 'center', '700');
  }
}

let last = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t-last)/1000); last = t;
  update(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, cv.width, cv.height);
  drawWorld(); drawHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
